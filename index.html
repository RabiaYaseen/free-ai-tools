
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Tools</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6fb;
  margin: 0;
  text-align: center;
}
header {
  background: #263b80;
  color: white;
  padding: 35px 15px;
}
main { padding: 25px 15px; }
.tool {
  background: white;
  padding: 25px;
  margin: 20px auto;
  max-width: 450px;
  border-radius: 12px;
  box-shadow: 0 2px 10px #ddd;
}
textarea {
  width: 95%;
  padding: 10px;
  box-sizing: border-box;
}
button {
  background: #263b80;
  color: white;
  border: none;
  padding: 12px 25px;
  border-radius: 7px;
  cursor: pointer;
}
</style>
</head>
<body>

<header>
<h1>Free AI Tools</h1>
<p>Useful Online Tools, Free for Everyone</p>
</header>

<main>
<h2>Our Free Tools</h2>

<div class="tool">
<h3>Word Counter</h3>
<p>Count words in your text easily.</p>

<textarea id="words" rows="5"
placeholder="Enter your text here..."></textarea>

<p id="result">Words: 0</p>

<button onclick="countWords()">Count Words</button>
</div>
</main>

<script>
function countWords() {
  let text = document.getElementById("words").value.trim();
  let count = text ? text.split(/\s+/).length : 0;
  document.getElementById("result").innerText = "Words: " + count;
}
</script>

</body>
</html>
